<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>Christmas Tree</title>
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: radial-gradient(circle at top, #1b2540 0%, #020308 60%, #000 100%);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Inter", sans-serif;
      color: #fff;
    }
    .container {
      width: 100%;
      height: 100%;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
    }
    #treeCanvas {
      max-width: 100%;
      max-height: 80vh;
    }
    .title {
      position: absolute;
      top: 4vh;
      width: 100%;
      text-align: center;
      font-size: 24px;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: #f5f5f5;
      text-shadow: 0 0 10px rgba(255,255,255,0.5);
    }
    .subtitle {
      position: absolute;
      bottom: 4vh;
      width: 100%;
      text-align: center;
      font-size: 14px;
      opacity: 0.8;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="title">Merry Christmas</div>
    <canvas id="treeCanvas" width="600" height="800"></canvas>
    <div class="subtitle">Made with ♥ by You</div>
  </div>

  <script>
    const canvas = document.getElementById("treeCanvas");
    const ctx = canvas.getContext("2d");

    function resize() {
      const ratio = 600 / 800;
      let w = window.innerWidth * 0.6;
      let h = w / ratio;
      if (h > window.innerHeight * 0.75) {
        h = window.innerHeight * 0.75;
        w = h * ratio;
      }
      canvas.width = w;
      canvas.height = h;
    }

    window.addEventListener("resize", resize);
    resize();

    // 生成简单的“树 + 灯光 + 雪花”动画
    const lights = [];
    const snowflakes = [];

    function drawBackground() {
      const w = canvas.width;
      const h = canvas.height;

      // 夜空渐变
      const g = ctx.createLinearGradient(0, 0, 0, h);
      g.addColorStop(0, "#1b2540");
      g.addColorStop(0.7, "#020308");
      g.addColorStop(1, "#000");
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, w, h);

      // 星星
      for (let i = 0; i < 80; i++) {
        const x = Math.random() * w;
        const y = Math.random() * h * 0.6;
        const r = Math.random() * 1.2;
        ctx.globalAlpha = Math.random();
        ctx.beginPath();
        ctx.arc(x, y, r, 0, Math.PI * 2);
        ctx.fillStyle = "#fff";
        ctx.fill();
      }
      ctx.globalAlpha = 1;
    }

    function drawTree() {
      const w = canvas.width;
      const h = canvas.height;

      const cx = w / 2;
      const topY = h * 0.15;
      const trunkHeight = h * 0.1;
      const trunkWidth = w * 0.06;
      const baseWidth = w * 0.7;

      // 树体三层三角形
      const layers = 3;
      for (let i = 0; i < layers; i++) {
        const layerTop = topY + (h * 0.12) * i;
        const layerHeight = h * 0.22;
        const layerWidth = baseWidth - i * (baseWidth * 0.2);

        const g = ctx.createLinearGradient(cx, layerTop, cx, layerTop + layerHeight);
        g.addColorStop(0, "#1bd165");
        g.addColorStop(1, "#054020");
        ctx.fillStyle = g;

        ctx.beginPath();
        ctx.moveTo(cx, layerTop);
        ctx.lineTo(cx - layerWidth / 2, layerTop + layerHeight);
        ctx.lineTo(cx + layerWidth / 2, layerTop + layerHeight);
        ctx.closePath();
        ctx.fill();
      }

      // 树干
      ctx.fillStyle = "#5b3a1d";
      ctx.fillRect(cx - trunkWidth / 2, h * 0.65, trunkWidth, trunkHeight);

      // 顶部星星
      const starRadius = w * 0.03;
      drawStar(cx, topY - starRadius * 0.2, starRadius, "#ffd700");
    }

    function drawStar(x, y, r, color) {
      ctx.save();
      ctx.translate(x, y);
      ctx.beginPath();
      const spikes = 5;
      const outerRadius = r;
      const innerRadius = r * 0.5;
      let rot = Math.PI / 2 * 3;
      let step = Math.PI / spikes;

      ctx.moveTo(0, -outerRadius);
      for (let i = 0; i < spikes; i++) {
        ctx.lineTo(Math.cos(rot) * outerRadius, Math.sin(rot) * outerRadius);
        rot += step;

        ctx.lineTo(Math.cos(rot) * innerRadius, Math.sin(rot) * innerRadius);
        rot += step;
      }
      ctx.lineTo(0, -outerRadius);
      ctx.closePath();
      ctx.fillStyle = color;
      ctx.shadowColor = color;
      ctx.shadowBlur = 15;
      ctx.fill();
      ctx.restore();
      ctx.shadowBlur = 0;
    }

    function initLights() {
      lights.length = 0;
      const w = canvas.width;
      const h = canvas.height;
      const cx = w / 2;
      const topY = h * 0.15;
      const baseWidth = w * 0.7;

      const colors = ["#ff5f5f", "#ffd166", "#4cc9f0", "#f72585", "#b5e48c"];

      for (let i = 0; i < 120; i++) {
        const t = Math.random(); // 从上到下的比例
        const y = topY + t * h * 0.5;

        // 对应这一高度的树宽度（线性缩小一点，营造三角形）
        const widthAtY = baseWidth * (1 - t * 0.8);
        const x = cx + (Math.random() - 0.5) * widthAtY * 0.8;

        lights.push({
          x,
          y,
          baseRadius: 2 + Math.random() * 2,
          color: colors[Math.floor(Math.random() * colors.length)],
          phase: Math.random() * Math.PI * 2
        });
      }
    }

    function initSnow() {
      snowflakes.length = 0;
      const w = canvas.width;
      const h = canvas.height;
      for (let i = 0; i < 80; i++) {
        snowflakes.push({
          x: Math.random() * w,
          y: Math.random() * h,
          r: 1 + Math.random() * 2,
          speedY: 0.3 + Math.random() * 0.8,
          drift: (Math.random() - 0.5) * 0.3
        });
      }
    }

    function drawLights(time) {
      lights.forEach(light => {
        const twinkle = 0.4 + 0.6 * (0.5 + 0.5 * Math.sin(time / 400 + light.phase));
        const r = light.baseRadius * twinkle;
        ctx.beginPath();
        ctx.arc(light.x, light.y, r, 0, Math.PI * 2);
        ctx.fillStyle = light.color;
        ctx.shadowColor = light.color;
        ctx.shadowBlur = 15 * twinkle;
        ctx.fill();
        ctx.shadowBlur = 0;
      });
    }

    function drawSnow() {
      const w = canvas.width;
      const h = canvas.height;
      snowflakes.forEach(s => {
        s.y += s.speedY;
        s.x += s.drift;

        if (s.y > h) {
          s.y = -5;
          s.x = Math.random() * w;
        }
        if (s.x < -5) s.x = w + 5;
        if (s.x > w + 5) s.x = -5;

        ctx.globalAlpha = 0.5;
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
        ctx.fillStyle = "#ffffff";
        ctx.fill();
        ctx.globalAlpha = 1;
      });
    }

    function animate(time) {
      drawBackground();
      drawTree();
      drawLights(time || 0);
      drawSnow();
      requestAnimationFrame(animate);
    }

    initLights();
    initSnow();
    requestAnimationFrame(animate);
  </script>
</body>
</html>
